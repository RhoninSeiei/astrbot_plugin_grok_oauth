name: Windows and Linux filesystem compatibility

on:
  push:
    paths:
      - '.github/workflows/credential-compat.yml'
      - 'grok_oauth/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - 'astrbot_adapter/diagnostics.py'
      - 'astrbot_adapter/media_delivery.py'
      - 'tests/unit/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credentials:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.12'
            pillow: '12.2.0'
          - os: windows-latest
            python: '3.12'
            pillow: '13.0.0'
          - os: windows-latest
            python: '3.13'
            pillow: '12.2.0'
          - os: windows-latest
            python: '3.13'
            pillow: '13.0.0'
          - os: ubuntu-latest
            python: '3.12'
            pillow: '12.2.0'
          - os: ubuntu-latest
            python: '3.12'
            pillow: '13.0.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated test dependencies
        run: python -m pip install "httpx>=0.28.1,<0.29" "filelock>=3.29,<5" "Pillow==${{ matrix.pillow }}" pytest pytest-asyncio
      - name: Verify the core Pillow pin requires no dependency replacement
        env:
          EXPECTED_PILLOW: ${{ matrix.pillow }}
        shell: python
        run: |
          import json
          import os
          import subprocess
          import sys
          import tempfile
          from importlib.metadata import version
          from pathlib import Path

          existing = version("Pillow")
          assert existing == os.environ["EXPECTED_PILLOW"]
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              constraint = root / "core-constraints.txt"
              report = root / "pip-report.json"
              constraint.write_text(f"Pillow=={existing}\n", encoding="utf-8")
              subprocess.run(
                  [
                      sys.executable, "-m", "pip", "install", "--dry-run", "--no-index",
                      "--disable-pip-version-check", "--report", str(report),
                      "-c", str(constraint), "-r", "requirements.txt",
                  ],
                  check=True,
              )
              assert json.loads(report.read_text(encoding="utf-8"))["install"] == []
          assert version("Pillow") == existing
          print(f"Existing Pillow {existing} satisfies plugin and core constraints")
      - name: Verify credentials, media, outbox and diagnostic files
        run: python -B scripts/run_tests.py tests/unit/test_token_store.py tests/unit/test_credentials.py tests/unit/test_device_flow.py tests/unit/test_oauth_diagnostics.py tests/unit/test_windows_media.py tests/unit/test_windows_storage.py tests/unit/test_media.py tests/unit/test_media_limits.py tests/unit/test_video_import.py tests/unit/test_videos.py tests/unit/test_video_modes.py -q --junitxml=credential-tests.xml
      - name: Require nonempty passing tests without skips
        run: python -B scripts/verify_integration_report.py credential-tests.xml
